# Pipeline di integrazione continua di Heirloom.Financial (HA-004, soglia di copertura HA-040).
# A ogni push e pull request verso main o develop:
# installa .NET 9 e 10, compila, esegue i test su entrambe le versioni,
# misura la copertura, pubblica il riepilogo e fallisce se la copertura delle righe è sotto il 90%.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Se arriva un nuovo push sullo stesso branch, la pipeline vecchia viene annullata.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e test
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MIN_LINE_COVERAGE: 90

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v6

      - name: Installa .NET 9 e .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Ripristina i pacchetti NuGet
        run: dotnet restore

      - name: Compila
        run: dotnet build --configuration Release --no-restore

      - name: Esegui i test con copertura
        run: >
          dotnet test
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx"

      - name: Crea il report di copertura
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -assemblyfilters:"+Heirloom.Financial" \
            -reporttypes:"Html;MarkdownSummaryGithub;JsonSummary"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Controlla la copertura minima
        run: |
          coverage=$(jq '.summary.linecoverage' CoverageReport/Summary.json)
          echo "Copertura delle righe: ${coverage}% (minimo ${MIN_LINE_COVERAGE}%)"
          if awk -v c="$coverage" -v m="$MIN_LINE_COVERAGE" 'BEGIN { exit !(c < m) }'; then
            echo "::error::Copertura delle righe ${coverage}% sotto il minimo del ${MIN_LINE_COVERAGE}%."
            exit 1
          fi

      - name: Salva risultati dei test e report di copertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-e-copertura
          path: |
            TestResults/
            CoverageReport/
          retention-days: 14
